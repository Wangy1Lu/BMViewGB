services:
  - type: web
    name: wangy1lu-bmviewgb-backend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && python backend/manage.py collectstatic --noinput
    startCommand: cd backend && python manage.py migrate --noinput && python manage.py bootstrap_data --require-data && gunicorn core.wsgi:application --bind 0.0.0.0:$PORT --timeout 120
    healthCheckPath: /api/available-variables/
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.14
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com localhost 127.0.0.1"
      - key: FRONTEND_ORIGINS
        value: "https://wangy1lu-bmviewgb-frontend.onrender.com"
      - key: CORS_ALLOWED_ORIGIN_REGEXES
        value: "^https://.*\\.onrender\\.com$"
      - key: BMVIEWGB_DATA_DIR
        value: /tmp/bmviewgb-data
      - key: DATA_BUNDLE_URL
        sync: false

  - type: web
    name: wangy1lu-bmviewgb-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/build
    envVars:
      - key: REACT_APP_API_BASE_URL
        value: https://wangy1lu-bmviewgb-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
